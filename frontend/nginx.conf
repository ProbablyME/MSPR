server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── En-têtes de sécurité (appliqués à toutes les réponses) ────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    # CSP : autorise self + tuiles OpenStreetMap (Leaflet) et styles inline Leaflet.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'" always;
    server_tokens off;

    # Compression gzip pour les assets statiques
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache long pour les assets buildés (Vite génère des noms avec hash)
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy vers l'API FastAPI (évite les problèmes CORS en production)
    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback — toujours servir index.html pour le routage côté client
    location / {
        try_files $uri $uri/ /index.html;
    }
}
