[project]
name = "railcarbon"
version = "0.1.0"
requires-python = ">=3.11"
# Pas de dépendances obligatoires : chaque groupe est activé selon le besoin
dependencies = []

# ── Workspace uv ──────────────────────────────────────────────────────────────
# Un seul uv.lock à la racine couvre tous les membres du workspace
[tool.uv.workspace]
members = ["api"]

# ── Groupes de dépendances ────────────────────────────────────────────────────
# ETL  : uv sync --group etl
# Tests: uv sync --group dev   (railcarbon-api est installé via le workspace)

[dependency-groups]

etl = [
    "pyspark>=3.5",
    "psycopg2-binary>=2.9",
    "openpyxl>=3.1",
    "requests>=2.31",
    "python-dateutil>=2.8",
    "reverse-geocode>=1.6",
    "python-logging-loki>=0.3",
]

dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.6.9",
    "psycopg2-binary>=2.9",
]

# ── Configuration pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["api/src", "api/tests"]
# --cov-report=xml : ingéré par SonarQube (sonar.python.coverage.reportPaths)
addopts = "-v --cov=api --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=80"
markers = [
    "integration: tests nécessitant une vraie base PostgreSQL seedée (ignorés sans DB)",
]
# Bruit de teardown du TestClient Starlette/anyio (flux mémoire non fermés) :
# sans impact fonctionnel, masqué pour garder une sortie de tests lisible.
filterwarnings = [
    "ignore::ResourceWarning",
]

# ── Couverture ────────────────────────────────────────────────────────────────
# relative_files : chemins RELATIFS dans coverage.xml (et non un chemin absolu
# Windows dans <source>), pour que SonarQube (scanner Linux) résolve la couverture.
[tool.coverage.run]
relative_files = true

# ── Configuration Ruff (lint + format) ────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["api/src", "api/tests"]
# Périmètre du gate qualité = le SERVICE déployé (api/). etl.py (batch Spark
# legacy non testé) et scripts ponctuels sont hors périmètre.
exclude = [
    ".venv", "downloads_gtfs", "opdi_cache", "jars", "backontrack", "htmlcov",
    "etl.py", "scripts",
]

[tool.ruff.lint]
# E/F (pyflakes+pycodestyle), I (isort), B (bugbear), UP (pyupgrade), C4 (comprehensions)
select = ["E", "F", "I", "B", "UP", "C4"]
# E501 : longueur de ligne non bloquante.
# B008 : idiome FastAPI (Depends()/Query() en valeur par défaut) — faux positif.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# conftest/intégration : API_TOKEN doit être posé dans l'env AVANT d'importer
# l'app → imports volontairement après du code (E402 assumé).
"api/tests/conftest.py" = ["E402"]
"api/tests/test_integration.py" = ["E402"]
# Helpers de tests : dict(...) lisible toléré (C408).
"api/tests/*.py" = ["C408"]
