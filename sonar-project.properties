# ============================================================
# Configuration SonarQube — ObRail Europe
# Lue par le sonar-scanner (local ou CI). host.url + token sont fournis
# par l'environnement (SONAR_HOST_URL / SONAR_TOKEN), jamais committés.
# ============================================================

sonar.projectKey=obrail-europe
sonar.projectName=ObRail Europe
sonar.projectVersion=2.0.0

# ── Périmètre analysé ─────────────────────────────────────────────────────────
# Service déployé (API Python) + frontend React. etl.py (batch Spark legacy) et
# scripts ponctuels sont hors périmètre qualité.
sonar.sources=api/src,frontend/src
sonar.tests=api/tests

# ── Python ────────────────────────────────────────────────────────────────────
sonar.python.version=3.11
# Rapport de couverture généré par `pytest --cov-report=xml`.
sonar.python.coverage.reportPaths=coverage.xml

# ── JavaScript / React ────────────────────────────────────────────────────────
# (les tests E2E Playwright ne produisent pas de couverture unitaire JS)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ── Exclusions ────────────────────────────────────────────────────────────────
sonar.exclusions=**/node_modules/**,**/dist/**,**/htmlcov/**,**/.venv/**,frontend/e2e/**
sonar.coverage.exclusions=api/tests/**,**/*.test.*,frontend/e2e/**

sonar.sourceEncoding=UTF-8
