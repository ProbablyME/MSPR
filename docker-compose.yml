services:
  postgres:
    image: postgres:16-alpine
    container_name: railcarbon_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis (voir .env.example)}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      # 5432 est occupé par le PostgreSQL local → on expose sur 5433
      - "5433:5432"
    volumes:
      # Initialisation automatique du schéma au premier démarrage
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      # Données réelles pré-chargées (export pg_dump)
      - ./seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql
      # Correction des codes pays (géocodage inverse) appliquée après le seed
      - ./seed_country_fix.sql:/docker-entrypoint-initdb.d/03_fix_country.sql
      # Correction des émissions avion (facteurs ADEME — cf. fichier) après le seed
      - ./seed_avion_co2_fix.sql:/docker-entrypoint-initdb.d/04_fix_avion_co2.sql
      # Persistance des données entre redémarrages
      - railcarbon_pgdata:/var/lib/postgresql/data
    healthcheck:
      # L'API ne démarre que lorsque Postgres accepte les connexions
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Sauvegarde automatique de la BDD (pg_dump quotidien + rotation) ─────────
  backup:
    image: postgres:16-alpine
    container_name: railcarbon_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # PGPASSWORD est lu par pg_dump pour s'authentifier.
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis (voir .env.example)}
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_NAME: ${DB_NAME:-postgres}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}   # quotidien par défaut
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}      # rétention 7 jours
    volumes:
      - ./scripts/backup_db.sh:/usr/local/bin/backup_db.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup_db.sh"]

  # ── Loki : stockage des logs Python ────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: railcarbon_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - railcarbon_loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  # ── Prometheus : métriques HTTP de l'API (latence, erreurs, débit) ─────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: railcarbon_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml
      - railcarbon_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    depends_on:
      - api

  # ── Grafana : dashboards logs + santé BDD + monitoring API ─────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: railcarbon_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # Variables interpolées par le provisioning de la datasource PostgreSQL
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD requis (voir .env.example)}
      - DB_NAME=${DB_NAME:-postgres}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - railcarbon_grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - postgres
      - prometheus

  # ── API FastAPI ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: railcarbon_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis (voir .env.example)}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-postgres}
      API_TOKEN: ${API_TOKEN:?API_TOKEN requis (voir .env.example)}
      # Active l'envoi des logs applicatifs de l'API vers Loki
      LOKI_URL: http://loki:3100/loki/api/v1/push
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      # "/" est public : vérifie que l'API répond sans jeton
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Frontend React/Vite (servi par nginx) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Le frontend doit présenter le même jeton Bearer que l'API
        VITE_API_TOKEN: ${VITE_API_TOKEN:-${API_TOKEN}}
    container_name: railcarbon_frontend
    restart: unless-stopped
    ports:
      # Interface web accessible sur http://localhost:5173
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  railcarbon_pgdata:
  railcarbon_loki_data:
  railcarbon_grafana_data:
  railcarbon_prometheus_data:
