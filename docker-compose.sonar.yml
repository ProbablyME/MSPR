# ============================================================
# docker-compose.sonar.yml — Serveur SonarQube (contrôle qualité du code)
#
# Stack SÉPARÉE de l'application : Sonar est un outil de DEV/CI, pas un service
# applicatif. On ne le mélange pas au docker-compose.yml de production.
#
# Démo locale / soutenance :
#   docker compose -f docker-compose.sonar.yml up -d
#   → SonarQube sur http://localhost:9000 (admin / admin au 1er démarrage)
#
# Analyse du projet (après avoir généré coverage.xml via `uv run pytest`) :
#   docker run --rm --network host \
#     -e SONAR_HOST_URL=http://localhost:9000 \
#     -e SONAR_TOKEN=<token-généré-dans-Sonar> \
#     -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli
#
# Prérequis hôte (Elasticsearch embarqué) :
#   sudo sysctl -w vm.max_map_count=262144
# ============================================================

services:
  sonarqube:
    image: sonarqube:community
    container_name: railcarbon_sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  sonar-db:
    image: postgres:16-alpine
    container_name: railcarbon_sonar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
